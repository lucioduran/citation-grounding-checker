[project]
name = "citation-grounding-checker"
version = "0.1.0"
description = "Exact passage evidence and offline local grounding comparisons"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["grounding"]

[tool.coverage.report]
show_missing = true
